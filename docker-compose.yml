#  School AI Monitoring System — Full Stack Docker Compose
#
#  Services:
#    postgres    — PostgreSQL 15 (lightweight alpine)
#    redis       — Redis 7 (lightweight alpine)
#    backend     — Node.js Express API (port 5000)
#    ml-worker   — Node.js BullMQ consumer (no port)
#    ml-service  — Python FastAPI ML server (port 8000)
#    web-admin   — Next.js admin dashboard (port 3000)
#
#  Usage:
#    cp .env.example .env    # fill in your values
#    docker compose up -d    # start all services
#    docker compose logs -f  # tail logs
#    docker compose down     # stop everything

services:

  postgres:
    image: postgres:15-alpine
    container_name: school_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-school_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - school_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-school_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: school_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - school_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API (Node.js + Express + Prisma) ────────────────────

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: school_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:Kkr%4013245@postgres:5432/${POSTGRES_DB:-school_db}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ROOT: /app/storage
      BACKEND_BASE_URL: http://backend:5000
    ports:
      - "5000:5000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - school_network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:5000/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Python FastAPI ML Service ────────────────────────────────────

  ml-service:
    build:
      context: . # root context — needed to access apps/ml-worker/src/ml/
      dockerfile: apps/ml-service/Dockerfile
    container_name: school_ml_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:Kkr%4013245@postgres:5432/${POSTGRES_DB:-school_db}
      STORAGE_ROOT: /app/storage
      BACKEND_BASE_URL: http://backend:5000
      BACKEND_URL: http://backend:5000/api
      BACKEND_TOKEN: ${BACKEND_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - school_network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s # extra time for ONNX model loading

  # ── Node.js ML Worker (BullMQ consumer) ─────────────────────────

  ml-worker:
    build:
      context: . # root context — needed to access prisma schema from backend
      dockerfile: apps/ml-worker/Dockerfile
    container_name: school_ml_worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:Kkr%4013245@postgres:5432/${POSTGRES_DB:-school_db}
      BACKEND_URL: http://backend:5000/api
      ML_SERVICE_URL: http://ml-service:8000
      BACKEND_TOKEN: ${BACKEND_TOKEN:-}
      STORAGE_ROOT: /app/storage
      BACKEND_BASE_URL: http://backend:5000
    volumes:
      - ./storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - school_network

  # ── Web Admin Dashboard (Next.js) ────────────────────────────────

  web-admin:
    build:
      context: ./apps/web-admin
      dockerfile: Dockerfile
    container_name: school_web_admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - school_network
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# ── Volumes ──────────────────────────────────────────────────────

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  
# ── Networks ─────────────────────────────────────────────────────

networks:
  school_network:
    driver: bridge
